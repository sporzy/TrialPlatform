<!doctype html>
<html lang="{{lingua}}">
<head>
  <meta charset="utf-8">
  <!-- Immagine di anteprima per le condivisioni (1200×630), generata da anteprime.mjs. -->
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 64px 80px 56px;
      background: #1d5a36;
      color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }

    .marchio {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .marchio svg { width: 56px; height: 56px; }

    h1 {
      margin: 0;
      max-width: 15ch;
      font-size: 92px;
      line-height: 1.04;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }

    h1 em {
      font-style: normal;
      color: #a8e2bd;
    }

    .dominio {
      font-size: 30px;
      font-weight: 600;
      color: #dcefe2;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="marchio">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="#dcefe2" />
      <path d="M5 23 L11 14 L15 19 L20 9 L27 23" fill="none" stroke="#1d5a36" stroke-width="2.6"
        stroke-linejoin="round" stroke-linecap="round" />
    </svg>
    Fair KM
  </div>
  <h1>{{apertura.titolo}}</h1>
  <div class="dominio">fairkm.com</div>
</body>
</html>
