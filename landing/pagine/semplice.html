<!doctype html>
<html lang="{{lingua}}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{s.titolo}} · Fair KM</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f0e6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141a16" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
{{css.base}}

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--carta);
      color: var(--inchiostro);
      font-family: var(--sans);
      font-size: 1.0625rem;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 4px;
    }

    a:hover {
      color: var(--marchio);
    }

    :focus-visible {
      outline: 2px solid var(--marchio);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .contenuto {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 16px;
    }

    .testata {
      padding-top: 22px;
      padding-bottom: 22px;
    }

    .marchio img {
      display: block;
      height: 30px;
      width: auto;
    }

    main {
      padding-top: 48px;
      padding-bottom: 72px;
    }

    h1 {
      margin: 0;
      font-weight: 650;
      font-size: clamp(2.125rem, 6vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }

    h2 {
      margin: 36px 0 0;
      font-size: 1.25rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    p {
      margin: 12px 0 0;
      color: var(--testo-2);
    }

    h1+p {
      margin-top: 20px;
      font-size: 1.25rem;
    }

    .aggiornata {
      margin-top: 40px;
      font-family: var(--mono);
      font-size: 0.8125rem;
    }

    .bottone {
      display: inline-flex;
      align-items: center;
      min-height: 50px;
      margin-top: 32px;
      padding: 0 26px;
      border-radius: 999px;
      background: var(--marchio);
      color: var(--carta);
      font-weight: 650;
      text-decoration: none;
    }

    .bottone:hover {
      color: var(--carta);
      background: var(--inchiostro);
    }

    .piede {
      padding-top: 28px;
      padding-bottom: 40px;
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--testo-2);
    }
  </style>
</head>

<body>
  <header class="contenuto testata">
    <a class="marchio" href="{{home}}" aria-label="{{marchio.aria}}">
      <picture>
        <source srcset="/logo/fairkm-menta.svg" media="(prefers-color-scheme: dark)">
        <img src="/logo/fairkm-verde.svg" alt="" width="146" height="30">
      </picture>
    </a>
  </header>

  <main class="contenuto">
{{s.corpo}}
  </main>

  <footer class="contenuto piede">
    <p>{{piede.testo}}</p>
  </footer>
  {{analytics}}
</body>

</html>
