# Blueprint di Render per Fair KM: l'app delle gare (Next.js) e il suo database Postgres.
# Creato e allineato con la CLI di Render (render ea blueprints create / approve); ogni push su main lo riallinea.
# Su fairkm.com l'app non ha un dominio suo: il Worker della landing inoltra /races/, /<lingua>/races/ e /_next/
# all'indirizzo .onrender.com del servizio (APP_ORIGIN in landing/wrangler.jsonc).
services:
  - type: web
    name: fairkm-app
    runtime: node
    # Francoforte: vicino a chi legge (Europa) e ai server di Cloudflare che inoltrano.
    region: frankfurt
    # Il piano gratuito si spegne dopo 15 minuti senza visite e riparte in circa un minuto:
    # il Worker aspetterebbe troppo. Starter resta sempre acceso.
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    # Prima di ogni deploy applica le migrazioni nuove di db/migrations (rilanciarle non rifà nulla).
    preDeployCommand: npm run db:migra
    startCommand: npm start
    healthCheckPath: /races/
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Indirizzo interno del database: Render lo passa da solo, la password non sta mai nel repository.
      - key: DATABASE_URL
        fromDatabase:
          name: fairkm-db
          property: connectionString
      # Controllo notturno delle fonti (src/app/interno/controllo): "prova" registra senza toccare dati né coda,
      # "attivo" applica la via di mezzo (CLAUDE.md, "Controllo notturno"). Si accende cambiando questo valore.
      - key: CONTROLLO_MODALITA
        value: prova
      # Segreto condiviso con il timer del Worker (wrangler secret CONTROLLO_SEGRETO). Il valore non sta qui:
      # si passa alla CLI di Render quando si approva il blueprint, dall'input standard.
      - key: CONTROLLO_SEGRETO
        sync: false

databases:
  - name: fairkm-db
    databaseName: fairkm
    user: fairkm
    # Il piano più piccolo a pagamento (256 MB); quello gratuito scade dopo 30 giorni.
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "18"
    # Il disco si paga a parte (per GB al mese) e Render ne propone 15: per le gare 1 GB basta e avanza.
    # Si può solo aumentare, mai ridurre.
    diskSizeGB: 1
    # Nessun accesso da internet: solo i servizi Render dello stesso account. Per lavorarci da fuori
    # si aggiunge per il tempo necessario il proprio IP qui o dalla dashboard.
    ipAllowList: []
